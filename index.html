<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-form" class="name-form hidden">
          <label id="name-form-label" for="player-name">¡Entraste al top! Tu nombre:</label>
          <div class="name-form-row">
            <input id="player-name" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" />
            <button id="save-record-btn">Guardar</button>
          </div>
        </div>

        <div class="records" id="overlay-records">
          <p class="records-title">RECORDS</p>
          <ol class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <b class="records-best-combo">0</b></span>
            <span>Líneas máx.: <b class="records-max-lines">0</b></span>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay hidden">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>

        <div class="records">
          <p class="records-title">RECORDS</p>
          <ol class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <b class="records-best-combo">0</b></span>
            <span>Líneas máx.: <b class="records-max-lines">0</b></span>
          </div>
        </div>

        <button id="start-btn">Jugar</button>
        <button id="reset-records-btn" class="link-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
